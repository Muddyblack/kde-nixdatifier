<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     width="512" height="512" viewBox="0 0 512 512" version="1.1">
  <defs>
    <!-- Background Squircle Gradient -->
    <radialGradient id="bg-grad" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#161922"/>
      <stop offset="70%" stop-color="#0b0c11"/>
      <stop offset="100%" stop-color="#050608"/>
    </radialGradient>

    <!-- Glowing Rim Gradient: Orange on left, Magenta at top, Violet/Blue at top-right, Cyan on right -->
    <linearGradient id="rim-grad" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#ff7700"/>
      <stop offset="30%" stop-color="#ff007f"/>
      <stop offset="60%" stop-color="#7209b7"/>
      <stop offset="100%" stop-color="#00f5d4"/>
    </linearGradient>

    <!-- Neon Glow Filter -->
    <filter id="neon-bloom" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="9" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="rim-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Gradients matching the master icon: -->
    <!-- 1. Left (rotate 60): Warm Fiery Orange -->
    <linearGradient id="arm-orange" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff4d00"/>
      <stop offset="50%" stop-color="#ff7b00"/>
      <stop offset="100%" stop-color="#ffae00"/>
    </linearGradient>

    <!-- 2. Top-Left / Top Horizontal (rotate 120): Hot Magenta / Neon Pink -->
    <linearGradient id="arm-magenta" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff007f"/>
      <stop offset="60%" stop-color="#f72585"/>
      <stop offset="100%" stop-color="#b5179e"/>
    </linearGradient>

    <!-- 3. Top / Top-Right (rotate 180): Violet / Purple -->
    <linearGradient id="arm-violet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9d4edd"/>
      <stop offset="60%" stop-color="#7209b7"/>
      <stop offset="100%" stop-color="#560bad"/>
    </linearGradient>

    <!-- 4. Right (rotate 240): Azure / Royal Blue -->
    <linearGradient id="arm-blue" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3a0ca3"/>
      <stop offset="60%" stop-color="#4361ee"/>
      <stop offset="100%" stop-color="#4895ef"/>
    </linearGradient>

    <!-- 5. Bottom-Right / Bottom Horizontal (rotate 300): Electric Cyan -->
    <linearGradient id="arm-cyan" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00b4d8"/>
      <stop offset="50%" stop-color="#48cae4"/>
      <stop offset="100%" stop-color="#00f5d4"/>
    </linearGradient>

    <!-- 6. Bottom / Bottom-Left (rotate 0): Purple-Magenta (connecting back to Orange) -->
    <linearGradient id="arm-bottom-pink" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b5179e"/>
      <stop offset="60%" stop-color="#e01a8e"/>
      <stop offset="100%" stop-color="#ff0054"/>
    </linearGradient>

    <!-- Single NixOS Lambda Arm Definition -->
    <path id="nixos-lambda" d="m 309.54892,-710.38827 122.19683,211.67512 -56.15706,0.5268 -32.6236,-56.8692 -32.85645,56.5653 -27.90237,-0.011 -14.29086,-24.6896 46.81047,-80.4901 -33.22946,-57.8257 z"/>
  </defs>

  <!-- Squircle Base Tile -->
  <rect x="24" y="24" width="464" height="464" rx="112" ry="112"
        fill="url(#bg-grad)"/>
  
  <!-- Glowing Squircle Rim -->
  <rect x="24" y="24" width="464" height="464" rx="112" ry="112"
        fill="none" stroke="url(#rim-grad)" stroke-width="4" filter="url(#rim-glow)" opacity="0.9"/>

  <!-- 6-Lambda NixOS Snowflake with Correctly Ordered Color Scheme -->
  <g transform="translate(256, 256) scale(0.68) translate(-407.2, 715.8)" filter="url(#neon-bloom)">
    <!-- Lambda at Bottom (rotate 0): Pink / Purple -->
    <use href="#nixos-lambda" fill="url(#arm-bottom-pink)" transform="rotate(0, 407.2, -715.8)"/>
    <!-- Lambda at Left (rotate 60): Warm Fiery Orange -->
    <use href="#nixos-lambda" fill="url(#arm-orange)" transform="rotate(60, 407.2, -715.8)"/>
    <!-- Lambda at Top-Left / Top (rotate 120): Hot Magenta -->
    <use href="#nixos-lambda" fill="url(#arm-magenta)" transform="rotate(120, 407.2, -715.8)"/>
    <!-- Lambda at Top-Right (rotate 180): Violet / Purple -->
    <use href="#nixos-lambda" fill="url(#arm-violet)" transform="rotate(180, 407.2, -715.8)"/>
    <!-- Lambda at Right (rotate 240): Royal Blue -->
    <use href="#nixos-lambda" fill="url(#arm-blue)" transform="rotate(240, 407.2, -715.8)"/>
    <!-- Lambda at Bottom-Right (rotate 300): Electric Cyan -->
    <use href="#nixos-lambda" fill="url(#arm-cyan)" transform="rotate(300, 407.2, -715.8)"/>
  </g>
</svg>
