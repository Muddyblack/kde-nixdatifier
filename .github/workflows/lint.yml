name: Lint

on:
  pull_request:
  push:
    branches:
      - main
      - master

jobs:
  qml:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v27

      - name: qmllint
        run: nix develop --command bash -c 'find package/contents -name "*.qml" | xargs qmllint --unresolved-type info'

      - name: qmlformat check
        run: |
          nix develop --command bash -c '
            status=0
            for f in $(git ls-files "*.qml"); do
              qmlformat "$f" | cmp -s - "$f" || { echo "needs formatting: $f"; status=1; }
            done
            [ "$status" -eq 0 ] || echo "Run: qmlformat -i <file>"
            exit "$status"'
